<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Safe versus consequential actions</title><desc id="d">Three columns distinguish reversible exploration, governed Reality writes, and automatic derived consequences.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6bd5c3"/></marker></defs><rect width="1600" height="900" fill="#081115"/><g font-family="Inter,Arial"><text x="80" y="85" fill="#f4f7f5" font-size="40" font-weight="700">SAFE VS CONSEQUENTIAL ACTIONS</text><text x="80" y="125" fill="#8da1a8" font-size="18">Explore cheaply. Cross the governance boundary deliberately. Let consequences recalculate.</text><g fill="#0f1c21" stroke="#344b53" stroke-width="2"><rect x="70" y="205" width="430" height="545" rx="18"/><rect x="585" y="205" width="430" height="545" rx="18" stroke="#f1c76f"/><rect x="1100" y="205" width="430" height="545" rx="18" stroke="#6bd5c3"/></g><g font-size="17" font-weight="700" letter-spacing="1.5"><text x="100" y="250" fill="#7fc7ff">SAFE / REVERSIBLE</text><text x="615" y="250" fill="#f1c76f">GOVERNED REALITY WRITES</text><text x="1130" y="250" fill="#6bd5c3">DERIVED CONSEQUENCES</text></g><g fill="#e7efec" font-size="21"><text x="110" y="315">Search · Trace · Inspector</text><text x="110" y="365">Switch project / Back / Forward</text><text x="110" y="415">Move Scenario levers</text><text x="110" y="465">Assume an existing gate decided</text><text x="110" y="515">Scrub output-side target</text><text x="110" y="565">Preview report recipe</text><text x="110" y="615">Change layout / zoom / Views</text><text x="110" y="665">Discard → Back to Reality</text><text x="625" y="315">Accept owner-specific proposal</text><text x="625" y="365">Create / decide a Decision</text><text x="625" y="415">Declare Dependency</text><text x="625" y="465">Confirm complete actual team</text><text x="625" y="515">Commit supported Scenario inputs</text><text x="625" y="565">Set canonical target</text><text x="625" y="615">Activate project</text><text x="625" y="665">Create immutable report</text><text x="1140" y="315">Forecast recomputes</text><text x="1140" y="365">Dependent dates propagate</text><text x="1140" y="415">Timeline projection refreshes</text><text x="1140" y="465">Control Room re-reads</text><text x="1140" y="515">Report Readiness changes</text><text x="1140" y="565">Future reports use new state</text><text x="1140" y="615">Historical reports stay frozen</text></g><g stroke="#6bd5c3" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M500 480h78"/><path d="M1015 480h78"/></g><rect x="150" y="790" width="1300" height="62" rx="14" fill="#111c20" stroke="#2f444b"/><text x="800" y="829" text-anchor="middle" fill="#f4f7f5" font-size="20" font-weight="700">A derived change is a new reading, not a second write.</text></g></svg>

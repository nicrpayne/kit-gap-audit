<g text-anchor="middle"><text x="187" y="285" fill="#f3f6f4" font-size="20" font-weight="700">TRANSCRIPT / SOURCE</text><text x="187" y="320" fill="#98abb1" font-size="15">what was actually said</text><text x="500" y="285" fill="#f3f6f4" font-size="20" font-weight="700">EVIDENCE PASSAGE</text><text x="500" y="320" fill="#98abb1" font-size="15">bounded quote + provenance</text><text x="825" y="285" fill="#f3f6f4" font-size="20" font-weight="700">INTELLIGENCE</text><text x="825" y="320" fill="#98abb1" font-size="15">structured, synthesized</text><text x="1150" y="275" fill="#b7a4ff" font-size="20" font-weight="700">AUDIT PROPOSAL</text><text x="1150" y="310" fill="#98abb1" font-size="15">candidate owner mutation</text><text x="1285" y="460" fill="#f1c76f" font-size="20" font-weight="700">HUMAN ACCEPTS?</text><text x="1285" y="495" fill="#98abb1" font-size="15">owner-specific validation</text><text x="1150" y="685" fill="#6bd5c3" font-size="21" font-weight="700">SIGNAL REALITY</text><text x="1150" y="720" fill="#98abb1" font-size="15">canonical owner truth</text><text x="807" y="685" fill="#f3f6f4" font-size="20" font-weight="700">FORECAST</text><text x="807" y="720" fill="#98abb1" font-size="15">automatic consequence</text><text x="457" y="685" fill="#f3f6f4" font-size="20" font-weight="700">TIMELINE · REPORT</text><text x="457" y="720" fill="#98abb1" font-size="15">compose and freeze</text></g>

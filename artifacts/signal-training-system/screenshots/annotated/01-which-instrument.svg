<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Which Signal instrument should I use?</title><desc id="d">A question-led routing map.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#587078"/></marker></defs><rect width="1600" height="900" fill="#081115"/><g font-family="Inter,Arial"><text x="80" y="85" fill="#f4f7f5" font-size="40" font-weight="700">WHICH INSTRUMENT DO I USE?</text><text x="80" y="125" fill="#8da1a8" font-size="18">Route by the question. Govern only in the instrument that owns the truth.</text>
<g stroke="#587078" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M800 225v55"/><path d="M800 360v50"/><path d="M800 490l-600 90"/><path d="M800 490l-400 90"/><path d="M800 490l-200 90"/><path d="M800 490v90"/><path d="M800 490l200 90"/><path d="M800 490l400 90"/><path d="M800 490l600 90"/></g>
